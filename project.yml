name: SpruceMyMac

options:
  bundleIdPrefix: com.van426326
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Release:
      ARCHS: "$(ARCHS_STANDARD)"
      ONLY_ACTIVE_ARCH: NO
      DEAD_CODE_STRIPPING: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

targets:
  SpruceMyMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    resources:
      - path: LICENSE
      - path: NOTICE.md
      - path: THIRD_PARTY_NOTICES.md
    dependencies:
      - target: SpruceMyMacHelper
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.van426326.sprucemymac
        PRODUCT_NAME: SpruceMyMac
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SpruceMyMac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Van426326 and contributors. GPL-3.0-only."
    scheme:
      testTargets:
        - SpruceMyMacTests
    postBuildScripts:
      - path: Scripts/embed-legal.sh
        name: Embed legal documents
        basedOnDependencyAnalysis: false
      - path: Scripts/embed-helper.sh
        name: Embed privileged helper
        basedOnDependencyAnalysis: false
      - path: Scripts/embed-engine.sh
        name: Embed pinned Mole engine
        basedOnDependencyAnalysis: false
  SpruceMyMacHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes:
          - Resources
          - SECURITY.md
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.van426326.sprucemymac.helper
        PRODUCT_NAME: sprucemymac-helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  SpruceMyMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SpruceMyMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.van426326.sprucemymac.tests
        GENERATE_INFOPLIST_FILE: YES
